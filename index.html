<script>
const SALT="9rDVEDSO00EcE7N1zCv4dw==",IV="6bRpJJZvYea4/Q1O",ITER=250000;
const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(IV)},k,d(document.getElementById('blob').textContent.trim()));
  const fr=document.createElement('iframe');fr.srcdoc=new TextDecoder().decode(pt);
  document.body.replaceChildren(fr);
  try{sessionStorage.setItem('k',pw)}catch(e){}
}
async function attempt(pw){try{await unlock(pw);return true}catch(e){return false}}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();
  if(!(await attempt(document.getElementById('pw').value)))document.getElementById('err').textContent='Incorrect password. Try again.'});
try{const s=sessionStorage.getItem('k');if(s)attempt(s)}catch(e){}
</script></body></html>
